name: Deploy Server Lambdas

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  GO_VERSION: "1.24"

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      # Unit tests mock AWS and Bedrock. The SDK is pointed at a recorder
      # with fake credentials, and the job fails if any request reaches it.
      # (End-to-end runs against real services are tools/replay and
      # tools/playtest, run by hand.)
      - name: Run all tests (no AWS calls allowed)
        working-directory: server
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4599
          AWS_ACCESS_KEY_ID: unit-tests-must-not-call-aws
          AWS_SECRET_ACCESS_KEY: unit-tests-must-not-call-aws
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python3 ../.github/scripts/aws_tripwire.py "$RUNNER_TEMP/aws-calls.log" 4599 &
          sleep 1
          go test ./... -race -timeout 120s
          if [ -s "$RUNNER_TEMP/aws-calls.log" ]; then
            echo "::error::Unit tests called AWS. Mock the client instead:"
            cat "$RUNNER_TEMP/aws-calls.log"
            exit 1
          fi

  deploy:
    name: Build & Deploy Lambdas
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Deploys run one at a time, oldest first. A running deploy is never
    # cancelled mid-update; GitHub keeps only the newest pending run, so the
    # latest commit on main is always the last one deployed.
    concurrency:
      group: deploy-server-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and zip all Lambdas
        working-directory: server
        run: |
          set -e
          LAMBDAS=(ws-connect ws-disconnect ws-chat ws-game-action http-games http-users http-admin http-invites cognito-post-confirm world-gen)
          for name in "${LAMBDAS[@]}"; do
            echo "Building $name..."
            GOARCH=arm64 GOOS=linux go build \
              -tags lambda.norpc \
              -trimpath \
              -ldflags="-s -w" \
              -o "/tmp/${name}/bootstrap" \
              ./cmd/${name}/
            cd /tmp/${name}
            zip -q "/tmp/${name}.zip" bootstrap
            cd -
          done

      - name: Update Lambda function code
        run: |
          set -e
          LAMBDAS=(ws-connect ws-disconnect ws-chat ws-game-action http-games http-users http-admin http-invites cognito-post-confirm world-gen)
          PREFIX="amazing-adventure-prod"
          for name in "${LAMBDAS[@]}"; do
            FUNCTION_NAME="${PREFIX}-${name}"
            echo "Deploying $FUNCTION_NAME..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb:///tmp/${name}.zip" \
              --architectures arm64 \
              --query 'FunctionName' --output text
            # Wait for update to complete before moving to next function
            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME"
            echo "$FUNCTION_NAME deployed successfully"
          done
